name: 🚀 Feature request
description: Propose a feature for this project
labels: ["needs triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Use this form to propose a portfolio improvement. For requests concerning
        the underlying theme, consult the [al-folio project](https://github.com/alshedivat/al-folio).

  - type: checkboxes
    id: requirements
    attributes:
      label: Have you checked that your feature request isn't already filed?
      description: >
        Please check if somebody else has already filed the same 🚀 feature request.
        If you find a similar feature request, please add a 👍 reaction or comment on the original post.
      options:
        - label: I searched this repository's issues and did not find an existing request.
          required: true

  - type: textarea
    attributes:
      label: Description & Motivation
      description: A clear and concise description of the 🚀 feature proposal
      placeholder: |
        Please outline the motivation for the proposal.
        Is your feature request related to a problem? e.g., I'm always frustrated when [...].
        If this is related to another GitHub issue, please link it here

  - type: textarea
    attributes:
      label: Pitch
      description: A clear and concise description of what you want to happen.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Alternatives
      description: A clear and concise description of any alternative solutions or features you've considered, if any.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
