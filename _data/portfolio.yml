- id: dashboardqa
  title: DashboardQA
  category: agents-evaluation
  homepage: true
  homepage_order: 5
  work_order: 5
  meta: EACL 2026 Findings · Multimodal agents
  summary: A benchmark for agents that answer questions through real interactive dashboards.
  contribution: Co-created the benchmark to expose failures in grounding, planning, GUI interaction, and multi-view reasoning.
