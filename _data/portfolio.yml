- id: dsagentbench
  title: DSAgentBench
  category: agents-evaluation
  homepage: false
  work_order: 1
  meta: EMNLP 2026 Main
  summary: A benchmark for evaluating whether AI agents can complete end-to-end data-science workflows in real computer environments using notebooks, IDEs, terminals, browsers, and databases.
  evidence: 275 diverse tasks across the data-science lifecycle, 15 evaluated models, and deterministic evaluators. The best reported agent reached 56.70% task success.
  tags:
    - Agents
    - Computer Use
    - Evaluation
    - Data Science
    - Tool Orchestration
  links:
    - label: Paper
      url: https://arxiv.org/abs/2608.10366
    - label: Code
      url: https://github.com/vis-nlp/DSAgentBench

