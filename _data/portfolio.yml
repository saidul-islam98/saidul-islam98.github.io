- id: lvlm-judges
  title: Large and Tiny LVLM Judges
  category: agents-evaluation
  homepage: false
  work_order: 7
  meta: ACL and EMNLP 2025 Industry Tracks · Evaluation
  summary: Automated evaluation protocols for chart models using large and compact vision-language model judges.
