- id: dsagentbench
  title: DSAgentBench
  category: agents-evaluation
  homepage: true
  homepage_feature: true
  homepage_order: 1
  work_order: 1
  meta: EMNLP 2026 Main
  summary: A benchmark for evaluating whether AI agents can complete end-to-end data-science workflows in real computer environments using notebooks, IDEs, terminals, browsers, and databases.
  evidence: 275 diverse tasks across the data-science lifecycle, 15 evaluated models, and deterministic evaluators. The best reported agent reached 56.70% task success.
  tags:
    - Agents
    - Computer Use
    - Evaluation
    - Data Science
    - Tool Orchestration
  links:
    - label: Paper
      url: https://arxiv.org/abs/2608.10366
    - label: Code
      url: https://github.com/vis-nlp/DSAgentBench

- id: fine-grained-benchmark-generation
  title: Fine-Grained Benchmark Generation
  category: agents-evaluation
  homepage: true
  homepage_feature: true
  homepage_order: 2
  work_order: 2
  meta: Vector Institute · Foundation-model evaluation · 2026 preprint
  summary: A reference-grounded multi-agent pipeline for generating, verifying, repairing, and deduplicating technically demanding evaluation tasks.
  contribution: Built OCR ingestion and a multi-agent designer and verifier workflow with iterative repair, trace-aware validation, and semantic deduplication.
  evidence: Trace-aware quality control connects source ingestion to final benchmark validation.
  tags:
    - OCR
    - Multi-agent Systems
    - Benchmark Generation
    - Evaluation
    - Deduplication
  links:
    - label: Paper
      url: https://arxiv.org/abs/2605.18824

- id: open-pmc-18m
  title: Open-PMC-18M
  category: multimodal-systems
  homepage: true
  homepage_order: 3
  work_order: 3
  meta: MICCAI 2026 · Multimodal medical AI
  summary: An open multimodal dataset and scalable pipeline linking biomedical figures with captions and subcaptions for medical vision-language learning.
  contribution: Owned preprocessing and batched vLLM inference for Qwen2.5-VL and Qwen2.5 summary generation.
  evidence: Scales compound-figure extraction, summarization, and OpenCLIP training across 18 million biomedical image-text pairs with optimized batched VLM inference.
  tags:
    - VLMs
    - vLLM
    - Data Pipelines
    - Medical AI
    - HPC
  links:
    - label: Paper
      url: https://arxiv.org/abs/2506.02738

- id: rl-text2vis
  title: RL-Text2Vis
  category: post-training-generation
  homepage: true
  homepage_order: 4
  work_order: 4
  meta: EACL 2026 Main · Post-training
  summary: A GRPO framework that evaluates text-to-visualization outputs after code execution using textual, executable, and visual feedback.
  contribution: Co-developed post-execution multimodal feedback for aligning generated text, code, and rendered visualizations.
  evidence: Improves code executability and chart quality over strong prompting and supervised baselines.
